name: Mise à jour du flux RSS CHU Lille

on:
  schedule:
    # Toutes les heures, à la minute 15
    - cron: "15 * * * *"

  # Permet également de lancer le script manuellement
  workflow_dispatch:

  # Lance aussi le workflow lorsqu'on modifie le script
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Générer le flux RSS
        run: |
          python generate_rss.py

      - name: Enregistrer le flux RSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rss.xml

          if git diff --cached --quiet; then
            echo "Aucune modification du flux RSS."
          else
            git commit -m "Mise à jour du flux RSS CHU Lille"
            git push
          fi

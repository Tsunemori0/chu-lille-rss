name: Publier le flux RSS

on:
  workflow_run:
    workflows: ["Mise à jour du flux RSS CHU Lille"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers
        run: |
          mkdir -p public
          cp rss.xml public/rss.xml

      - name: Uploader le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publier sur GitHub Pages
        uses: actions/deploy-pages@v4
